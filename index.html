<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Criar Conta</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" required>
            </div>

            <button type="submit">Cadastrar</button>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function (e) {
          // Impede o envio padrão do formulário (que tentaria dar POST na página do GitHub)
          e.preventDefault();
          
          const dados = {
            nome: document.querySelector('#nome')?.value,
            email: document.querySelector('#email')?.value,
            senha: document.querySelector('#senha')?.value
          };

          // A requisição POST deve ir estritamente para o n8n, NUNCA para o GitHub Pages
          fetch('https://lucasa0911.app.n8n.cloud/webhook/cadastro-faculdade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
          })
          .then(response => {
              if (response.ok) {
                  alert('Cadastro realizado com sucesso!');
                  document.querySelector('form').reset();
              } else {
                  alert('Ocorreu um erro ao realizar o cadastro no servidor.');
              }
          })
          .catch(error => {
              console.error('Erro:', error);
              alert('Erro de conexão com o servidor.');
          });
        });
    </script>
</body>
</html>
